    const TOTAL = FRAMES.length;
    const PER = 5;
    const KEY = 'rapture-words-start';
    const frameSrc = i => '10-20260801-02/' + FRAMES[i];

    function readStart() {
      try {
        const v = parseInt(localStorage.getItem(KEY), 10);
        if (Number.isInteger(v) && v >= 0 && v < TOTAL) return v;
      } catch (e) {}
      return 0;
    }

    function saveStart(v) {
      try { localStorage.setItem(KEY, String(v)); } catch (e) {}
    }

    // Show the 5 frames starting at the saved position, then save the next position.
    function nextFrames() {
      const start = readStart();
      const box = document.getElementById('frames');
      box.innerHTML = '';
      // The last group may be shorter (106–109); the next one starts again at 001.
      const end = Math.min(start + PER, TOTAL);
      for (let i = start; i < end; i++) {
        const img = document.createElement('img');
        img.src = frameSrc(i);
        img.alt = 'Rapture ' + FRAMES[i].replace('.jpg', '');
        box.appendChild(img);
      }
      const next = end % TOTAL;
      saveStart(next);
      // Preload the following group
      for (let i = next; i < Math.min(next + PER, TOTAL); i++) {
        new Image().src = frameSrc(i);
      }
    }

    nextFrames();
  </script>
